<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home Page</title>

    <!-- Bootstrap 5.3 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;400;600;800&display=swap" rel="stylesheet" />

    <!-- font-awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- Responsive CSS -->
    <link rel="stylesheet" href="./asset/css/responsive.css" />

    <!-- Main CSS -->
    <link rel="stylesheet" href="./asset/css/homePage.css" />
</head>

<body>
    <section class="background container-fluid">

        <!-- Header - Logo -->
        <div class="header_brand">
            <div class="brand-logo">
                <img src="./asset/img/logoShop.png" alt="">
            </div>

            <div class="brand-copy">
                <div class="brand-title">TechShop</div>
                <div class="brand-tagline">CÔNG NGHỆ TRONG TẦM TAY</div>
            </div>
        </div>


        <!-- Entry points -->
        <div class="container-fluid entry-section">
            <div class="row justify-content-center g-4 g-lg-5">
                <!-- Admin -->
                <div class="col-12 col-md-6 col-xl-5">
                    <a href="./admin/view/adminPage.html">
                        <!-- Header -->
                        <div class="card-header">
                            <img src="./asset/img/admin2.png" alt="">
                        </div>

                        <!-- Footer -->
                        <div class="card-footer">
                            <i class="fa-solid fa-user-tie"></i>

                            <div class="entry-copy">
                                <h2 class="entry-title">Admin Page</h2>
                                <p class="entry-subtitle">
                                    Quản lý hệ thống · Dữ liệu · Đơn hàng
                                </p>
                            </div>

                            <span class="entry-arrow" aria-hidden="true">→</span>
                        </div>
                    </a>
                </div>

                <!-- Store -->
                <div class="col-12 col-md-6 col-xl-5">
                    <a href="./customer/view/storePage.html">
                        <!-- Header -->
                        <div class="card-header">
                            <img src="./asset/img/iphone.png" alt="">
                        </div>

                        <!-- Footer -->
                        <div class="card-footer">
                            <i class="fa-solid fa-store"></i>

                            <div class="entry-copy">
                                <h2 class="entry-title">Store Page</h2>
                                <p class="entry-subtitle">
                                    Mua sắm · Khám phá sản phẩm
                                </p>
                            </div>

                            <span class="entry-arrow" aria-hidden="true">→</span>
                        </div>
                    </a>
                </div>

            </div>
        </div>

        <!-- Footer - Slogan -->
        <div class="footer_slogan">
            <span>CÔNG NGHỆ - UY TÍN - CHẤT LƯỢNG</span>
        </div>

    </section>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</body>

</html>
